<svg xmlns="http://www.w3.org/2000/svg" width="578" height="130" aria-label="Human verification widget animation" role="img" viewBox="0 0 578 130"><defs><linearGradient id="label-fade-grad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#000" stop-opacity="0"/><stop offset="14%" stop-color="#fff" stop-opacity="1"/><stop offset="86%" stop-color="#fff" stop-opacity="1"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></linearGradient><mask id="label-mask" maskUnits="userSpaceOnUse"><rect width="350" height="96" x="108" y="12" fill="url(#label-fade-grad)"/></mask></defs><style>@keyframes widget-scale{0%,13.3333%,16%{transform:scale(1)}14.6667%{transform:scale(.985)}}@keyframes idle-box-opacity{0%,14.6666%{opacity:1}14.6667%,99.999%{opacity:0}}@keyframes verifying-ring-opacity{0%,14.6666%,21.3333%{opacity:0}14.6667%,21.3332%{opacity:1}}@keyframes ring-progress{0%,14.6666%{stroke-dashoffset:87.9646}21.3333%,99.999%{stroke-dashoffset:0}}@keyframes final-check-opacity{0%,21.3332%{opacity:0}21.3333%,99.999%{opacity:1}}@keyframes check-draw{0%,21.3332%{stroke-dashoffset:100}23.6%,99.999%{stroke-dashoffset:0}}@keyframes label-initial{0%,14.6666%,99.3333%{opacity:1;transform:translateY(0)}15.8%,98.1999%{opacity:0;transform:translateY(-20px)}98.2%{opacity:0;transform:translateY(20px)}}@keyframes label-verifying{0%,15.1332%{opacity:0;transform:translateY(20px)}16.2667%,21.3332%{opacity:1;transform:translateY(0)}22.3333%{opacity:0;transform:translateY(-20px)}}@keyframes label-solved{0%,21.7999%{opacity:0;transform:translateY(20px)}22.9333%,97.7333%{opacity:1;transform:translateY(0)}98.8667%{opacity:0;transform:translateY(-20px)}}.ui-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;fill:#000;text-rendering:geometricPrecision}.label{font-size:34.2857px;font-weight:500;letter-spacing:.025em}.brand{font-size:26.8489px;font-weight:400;letter-spacing:.03em;fill:#212121}.widget-scale{transform-box:fill-box;transform-origin:center;animation:widget-scale 15s infinite;animation-timing-function:cubic-bezier(.22,1,.36,1)}.idle-box{animation:idle-box-opacity 15s linear infinite}.verifying-ring{animation:verifying-ring-opacity 15s linear infinite}.final-check path,.ring-progress{animation-timing-function:cubic-bezier(.16,1,.3,1);animation:check-draw 15s infinite}.ring-progress{animation:ring-progress 15s infinite}.final-check{animation:final-check-opacity 15s linear infinite}.label-initial,.label-solved,.label-verifying{animation-duration:15s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.25,1,.35,1)}.label-initial{animation-name:label-initial}.label-verifying{animation-name:label-verifying}.label-solved{animation-name:label-solved}</style><g><g class="widget-scale"><g transform="translate(289 65) translate(-289 -65)"><rect width="578" height="130" fill="#FDFDFD" rx="33"/><rect width="576.5" height="128.5" x=".75" y=".75" fill="none" stroke="#DDD" stroke-opacity=".561" stroke-width="1.5" rx="32.25"/><text x="502" y="87.544" class="ui-text brand">Cap</text><rect width="50" height="2" x="501" y="92" fill="#212121"/><g><g class="idle-box" transform="translate(61.5 64.5)"><rect width="53" height="53" x="-26.5" y="-26.5" fill="none" stroke="#AAA" stroke-opacity=".82" stroke-width="2" rx="12"/></g><g class="verifying-ring"><g transform="translate(61.5 64.5) scale(1.72) rotate(-90)"><circle cx="0" cy="0" r="14" fill="none" stroke="#eee" stroke-width="3"/><circle cx="0" cy="0" r="14" fill="none" stroke="currentColor" stroke-dasharray="87.965" stroke-dashoffset="87.965" stroke-linecap="round" stroke-width="3" class="ring-progress"/></g></g><g class="final-check"><path fill="none" stroke="#00A67D" stroke-dasharray="100" stroke-dashoffset="100" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.583" d="M-16.043 0.001L-4.5846 11.46L18.332 -11.457" pathLength="100" transform="translate(61.5 64.5)"/></g></g><g class="ui-text label" mask="url(#label-mask)"